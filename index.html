<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#d89a45" />
  <title>ひらがなガンマン</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app" aria-live="polite">
    <section id="titleScreen" class="screen active">
      <div class="sun"></div>
      <div class="title-card">
        <p class="eyebrow">かな入力ではやうちしょうぶ！</p>
        <h1>ひらがな<br><span>ガンマン</span></h1>
        <div class="duel-preview" aria-hidden="true">
          <img class="preview-enemy" src="images/enemy-stand.png" alt="">
        </div>
        <p class="title-sub">もじを はやく うって、<br>あいてのガンマンより さきに うとう！</p>
        <button id="startBtn" class="big-btn">ゲームをはじめる</button>
      </div>
    </section>

    <section id="setupScreen" class="screen">
      <div class="panel narrow">
        <h2>じゅんび</h2>
        <p class="lead">かな入力になっているか<br>たしかめよう。</p>
        <div class="test-card">
          <div class="test-label">「あ」と うってみよう</div>
          <input id="kanaCheck" class="kana-input" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="4" aria-label="かな入力確認" />
          <div id="checkMessage" class="check-message">ここをクリックして、かな入力で「あ」とうってね</div>
        </div>
        <button id="readyBtn" class="big-btn" disabled>じゅんびOK！</button>
        <button id="skipBtn" class="text-btn">先生といっしょに設定したので、そのまま進む</button>
      </div>
    </section>

    <section id="gameScreen" class="screen">
      <header class="hud">
        <div class="hud-item"><span>レベル</span><strong id="levelLabel">1</strong></div>
        <div class="hud-item"><span>しょうぶ</span><strong><span id="roundLabel">1</span>/5</strong></div>
        <div class="hud-item"><span>かち</span><strong id="winLabel">0</strong></div>
      </header>

      <div id="arena" class="arena solo-arena">
        <div id="shotLine" class="shot-line" aria-hidden="true"></div>
        <div id="dustLeft" class="dust dust-left" aria-hidden="true"></div>
        <div id="dustRight" class="dust dust-right" aria-hidden="true"></div>
        <div id="loseFlash" class="lose-flash" aria-hidden="true"></div>

        <div class="center-stage player-stage">
          <div id="countdown" class="countdown">READY!</div>
          <div id="target" class="target" aria-label="もんだい">あ</div>
          <div id="resultText" class="result-text"></div>
          <div id="playerBubble" class="bubble player-bubble">もじを うて！</div>
          <div class="input-help">かなキーを 1もじ うとう！</div>
          <input id="gameInput" class="ghost-input" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="ゲーム入力" />
        </div>

        <div class="fighter enemy">
          <div id="enemyBubble" class="bubble enemy-bubble">……</div>
          <div id="enemyCowboy" class="enemy-card">
            <img id="enemyStand" src="images/enemy-stand.png" alt="あいてのガンマン" class="enemy-img enemy-stand">
            <img id="enemyDown" src="images/enemy-down.png" alt="たおれた あいてのガンマン" class="enemy-img enemy-down">
            <div class="muzzle-flash"></div>
            <div class="impact"></div>
          </div>
          <div class="nameplate">あいてのガンマン</div>
        </div>
      </div>
      <button id="focusBtn" class="focus-btn">うてないときは ここをおす</button>
    </section>

    <section id="stageScreen" class="screen">
      <div class="panel narrow result-panel">
        <div id="stageBadge" class="stage-badge">⭐</div>
        <h2 id="stageTitle">ステージクリア！</h2>
        <p id="stageSummary" class="lead"></p>
        <button id="nextBtn" class="big-btn">つぎのレベルへ</button>
        <button id="retryBtn" class="big-btn secondary">もういちど</button>
        <button id="homeBtn" class="text-btn">タイトルにもどる</button>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
